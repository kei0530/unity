<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEBコンテンツフィルター</title>
  <link rel="stylesheet" href="content-filter.css">
</head>
<body>

  <div class="card">

    <!-- アイコンエリア：禁止マーク＋アクセス制限バッジ -->
    <div class="icon-area">
      <div class="icon-wrapper">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="20" cy="20" r="14" fill="#F59E0B" opacity="0.12"/>
          <circle cx="20" cy="20" r="14" stroke="#F59E0B" stroke-width="2"/>
          <line x1="29.9" y1="10.1" x2="10.1" y2="29.9" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="badge">
        <span class="badge-dot"></span>
        アクセス制限
      </span>
    </div>

    <!-- 見出し -->
    <h1 class="heading">WEBコンテンツフィルター</h1>

    <!-- 説明文 -->
    <p class="description">このページはアクセス制限されています</p>

    <!-- 禁止カテゴリの表示。{{CATEGORY}} はサーバー側で実際のカテゴリ名に置き換える -->
    <p class="category">禁止カテゴリ：{{CATEGORY}}</p>

    <!-- アクセスしようとしたURLの表示エリア。{{URL}} はサーバー側で実際のURLに置き換える -->
    <div class="url-section">
      <div class="url-label">アクセスURL</div>
      <div class="url-box">{{URL}}</div>
    </div>

    <hr class="divider">

    <!-- 補足テキスト。{{SERVER_ADMIN_URL}} はサーバー管理画面のURLに置き換える -->
    <div class="note">
      <svg class="note-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="8" cy="8" r="6.5" stroke="#9CA3AF" stroke-width="1.2"/>
        <path d="M8 7.5V11" stroke="#9CA3AF" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="8" cy="5.5" r="0.75" fill="#9CA3AF"/>
      </svg>
      <span>
        アクセスが必要な場合は<a class="note-link" href="{{MANUAL_URL}}">マニュアル</a>をご確認の上<br>
        システム管理者へご相談ください
      </span>
    </div>

  </div>

</body>
</html>
