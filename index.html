<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEBウィルスチェック</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">

    <!-- アイコンエリア：シールドアイコン＋ブロック済みバッジ -->
    <div class="icon-area">
      <div class="shield-wrapper">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M20 4L6 9.5V20C6 27.5 12.5 34.4 20 36C27.5 34.4 34 27.5 34 20V9.5L20 4Z" fill="#3B82F6" opacity="0.15"/>
          <path d="M20 4L6 9.5V20C6 27.5 12.5 34.4 20 36C27.5 34.4 34 27.5 34 20V9.5L20 4Z" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round"/>
          <path d="M14 20.5L18 24.5L26.5 16" stroke="#3B82F6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="badge">
        <span class="badge-dot"></span>
        ブロック済み
      </span>
    </div>

    <!-- 見出し -->
    <h1 class="heading">WEBウィルスチェック</h1>

    <!-- 説明文 -->
    <p class="description">このページからウィルスを検出しました</p>

    <!-- 検出URLの表示エリア。{{URL}} はサーバー側で実際のURLに置き換える -->
    <div class="url-section">
      <div class="url-label">検出URL</div>
      <div class="url-box">{{URL}}</div>
    </div>

    <hr class="divider">

    <!-- 補足テキスト。{{SERVER_ADMIN_URL}} はサーバー管理画面のURLに置き換える -->
    <div class="note">
      <svg class="note-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="8" cy="8" r="6.5" stroke="#9CA3AF" stroke-width="1.2"/>
        <path d="M8 7.5V11" stroke="#9CA3AF" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="8" cy="5.5" r="0.75" fill="#9CA3AF"/>
      </svg>
      <span>詳細は<a class="note-link" href="{{SERVER_ADMIN_URL}}">サーバー管理</a>より確認できます</span>
    </div>

  </div>

</body>
</html>
